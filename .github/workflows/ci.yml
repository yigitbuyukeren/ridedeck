name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push/PR supersedes an in-flight run; the emulator job is the slow one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, debug/release lint, APKs, AAB and Android test compilation
        run: ./gradlew test lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest bundleRelease
      - name: Summarize unit test reports
        run: >-
          python3 scripts/test-report-summary.py
          app/build/test-results/testDebugUnitTest
          app/build/test-results/testReleaseUnitTest
      - name: Verify release APK alignment
        run: |
          python3 scripts/check-apk-alignment.py app/build/outputs/apk/release/*.apk
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 4 app/build/outputs/apk/release/*.apk
      - name: Verify debug ABI and test-only asset packaging
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/libmaplibre.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libmaplibre.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/integration/offline_probe_style.json'
          echo "PASS: debug APK carries x86_64/ARM natives and the debug-only probe asset"
      - name: Verify release ABIs and AAB output
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/manifest/AndroidManifest.xml'
          if unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q 'lib/x86_64/'; then
            echo "FAIL: release APK must stay ARM-only" >&2
            exit 1
          fi
          if unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q 'assets/integration/offline_probe_style.json'; then
            echo "FAIL: test-only probe asset leaked into the release APK" >&2
            exit 1
          fi
          echo "PASS: release AAB produced; release APK is ARM-only and carries no probe asset"
      - name: Verify release signature (skipped without keystore.properties)
        run: python3 scripts/check-release-signature.py
      - uses: actions/upload-artifact@v7
        with:
          name: RideDeck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: RideDeck-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: RideDeck-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: RideDeck-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RideDeck-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/outputs/mapping/release/mapping.txt

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify KVM acceleration
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          grep -Eq '(vmx|svm)' /proc/cpuinfo
          echo "PASS: /dev/kvm is usable and the CPU exposes virtualization"
      # A cached AVD plus an extra boot/snapshot step made the job hang in the action's
      # unbounded `adb getprop` wait. One cold boot with a hard step timeout is predictable.
      - name: Run instrumentation tests on the x86_64 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -accel on
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            # The emulator's cached-app freezer can freeze the instrumentation process
            # between Compose tests even though the suite is still running.
            adb shell settings put global cached_apps_freezer disabled
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Summarize instrumentation reports
        if: always()
        run: >-
          python3 scripts/test-report-summary.py
          app/build/outputs/androidTest-results/connected/debug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RideDeck-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
